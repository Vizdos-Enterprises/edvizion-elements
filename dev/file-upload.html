<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <title>Image Processing Playground</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 1800px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
      }

      .subtitle {
        color: #a1a1aa;
        margin: 0 0 32px;
      }

      .playground {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .panel {
        min-width: 0;
        padding: 24px;
        border: 1px solid #27272a;
        border-radius: 16px;
        background: #18181b;
      }

      .panel h2 {
        margin: 0 0 8px;
      }

      .description {
        color: #a1a1aa;
        font-size: 14px;
        margin: 0 0 24px;
        min-height: 42px;
      }

      .upload {
        display: block;
        padding: 24px;
        border: 2px dashed #3f3f46;
        border-radius: 12px;
        background: #09090b;
        cursor: pointer;
        text-align: center;
        transition: border-color 150ms;
      }

      .upload:hover {
        border-color: #71717a;
      }

      .upload input {
        display: block;
        max-width: 100%;
        margin: 12px auto 0;
        font-size: 12px;
      }

      .upload:has(input:disabled) {
        opacity: 0.5;
        cursor: wait;
      }

      .upload-title {
        display: block;
        font-weight: 600;
      }

      .upload-hint {
        display: block;
        margin-top: 6px;
        color: #a1a1aa;
        font-size: 13px;
      }

      .status {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #27272a;
        font-size: 14px;
        font-weight: 500;
      }

      .status.success {
        background: #14532d;
        color: #bbf7d0;
      }

      .status.failure {
        background: #450a0a;
        color: #fecaca;
      }

      .status.processing {
        background: #172554;
        color: #bfdbfe;
      }

      .images {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .image-container {
        min-width: 0;
      }

      .image-container h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .image-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 10px;
        border: 1px solid #27272a;
        background: black;
      }

      .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .placeholder {
        padding: 12px;
        color: #71717a;
        font-size: 13px;
        text-align: center;
      }

      .image-info {
        margin-top: 8px;
        color: #a1a1aa;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .results {
        margin-top: 24px;
      }

      .results h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .analyzer-result {
        padding: 16px;
        margin-bottom: 10px;
        border: 1px solid #3f3f46;
        border-radius: 10px;
        background: #09090b;
      }

      .analyzer-result.passed {
        border-color: #166534;
      }

      .analyzer-result.failed {
        border-color: #991b1b;
      }

      .analyzer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .analyzer-name {
        font-weight: 600;
        font-size: 14px;
        text-transform: capitalize;
      }

      .badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
      }

      .passed .badge {
        color: #86efac;
        background: #14532d;
      }

      .failed .badge {
        color: #fca5a5;
        background: #450a0a;
      }

      .message {
        margin: 10px 0 0;
        font-size: 14px;
        color: #d4d4d8;
      }

      .score {
        margin-top: 12px;
        color: #a1a1aa;
        font-size: 12px;
      }

      .score-track {
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #27272a;
      }

      .score-fill {
        height: 100%;
        border-radius: inherit;
      }

      .passed .score-fill {
        background: #22c55e;
      }

      .failed .score-fill {
        background: #ef4444;
      }

      details {
        margin-top: 14px;
        color: #a1a1aa;
        font-size: 12px;
      }

      summary {
        cursor: pointer;
        user-select: none;
      }

      pre {
        padding: 12px;
        border-radius: 8px;
        background: #18181b;
        overflow-x: auto;
        font-size: 11px;
        line-height: 1.5;
      }

      .duration {
        margin-top: 16px;
        color: #a1a1aa;
        font-size: 12px;
        line-height: 1.8;
        white-space: pre-line;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 1200px) {
        .playground {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 800px) {
        .playground {
          grid-template-columns: 1fr;
        }

        body {
          padding: 16px;
        }

        .panel {
          padding: 16px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Image Processing Playground</h1>

      <p class="subtitle">
        Client-side image validation and extraction.
      </p>

      <div class="playground" id="playground"></div>
    </main>

    <template id="uploader-template">
      <section class="panel">
        <h2 class="panel-title"></h2>
        <p class="description"></p>

        <label class="upload">
          <span class="upload-title"></span>
          <span class="upload-hint"></span>

          <input type="file" accept="image/*" disabled>
        </label>

        <div class="status processing" role="status">
          Initializing…
        </div>

        <div class="images">
          <div class="image-container">
            <h3>Original</h3>

            <div class="image-preview">
              <span class="placeholder">
                No image selected
              </span>

              <img
                class="original-image"
                hidden
                alt="Original image"
              >
            </div>

            <div class="image-info original-info"></div>
          </div>

          <div class="image-container">
            <h3>Processed</h3>

            <div class="image-preview">
              <span class="placeholder">
                Awaiting valid image
              </span>

              <img
                class="output-image"
                hidden
                alt="Processed image"
              >
            </div>

            <div class="image-info output-info"></div>
          </div>
        </div>

        <div class="results">
          <h3>Analyzer Results</h3>
          <div class="analyzer-results"></div>
        </div>

        <div class="duration"></div>
      </section>
    </template>

    <script type="module">
      import {
        FilesetResolver,
        FaceDetector,
      } from '@mediapipe/tasks-vision';

      import {
        ImageProcessingPipeline,
        BrightnessAnalyzer,
        FaceAnalyzer,
        FaceCaptureProcessor,
        ScanicAnalyzer,
        ScanicCaptureProcessor,
        BarcodeAnalyzer,
        BarcodeCaptureProcessor,
      } from '/src/image-capture/index.ts';

      // --------------------------------------------------
      // Panel creation
      // --------------------------------------------------

      const playground = document.querySelector('#playground');

      const template =
        document.querySelector('#uploader-template');

      function createPanel({
        id,
        title,
        description,
        uploadTitle,
        uploadHint,
      }) {
        const fragment = template.content.cloneNode(true);
        const panel = fragment.querySelector('.panel');

        panel.id = id;

        panel.querySelector('.panel-title').textContent =
          title;

        panel.querySelector('.description').textContent =
          description;

        panel.querySelector('.upload-title').textContent =
          uploadTitle;

        panel.querySelector('.upload-hint').textContent =
          uploadHint;

        playground.append(fragment);

        return panel;
      }

      const headshotPanel = createPanel({
        id: 'headshot',
        title: 'Headshot',
        description:
          'Face detection, brightness validation, and portrait extraction.',
        uploadTitle: 'Select a headshot',
        uploadHint: 'Choose a photo containing one face',
      });

      const documentPanel = createPanel({
        id: 'document',
        title: 'Document',
        description:
          'Document detection, perspective correction, and extraction.',
        uploadTitle: 'Select a document',
        uploadHint: 'ID cards, forms, and other documents',
      });

      const barcodePanel = createPanel({
        id: 'barcode',
        title: 'PDF417 Barcode',
        description:
          'PDF417 readability validation and lossless barcode extraction.',
        uploadTitle: 'Select a barcode image',
        uploadHint: 'Back of an ID or an isolated PDF417 barcode',
      });

      // --------------------------------------------------
      // Utilities
      // --------------------------------------------------

      function formatBytes(bytes) {
        if (bytes < 1024) {
          return `${bytes} B`;
        }

        if (bytes < 1024 * 1024) {
          return `${(bytes / 1024).toFixed(1)} KB`;
        }

        return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
      }

      function formatAnalyzerName(id) {
        return id
          .replaceAll('-', ' ')
          .replaceAll('_', ' ');
      }

      function setStatus(panel, message, type = '') {
        const status = panel.querySelector('.status');

        status.className = `status ${type}`;
        status.textContent = message;
      }

      function setPlaceholder(image, message) {
        image.hidden = true;

        const placeholder =
          image.parentElement.querySelector('.placeholder');

        placeholder.textContent = message;
        placeholder.hidden = false;
      }

      function clearImage(image) {
        if (image.dataset.objectUrl) {
          URL.revokeObjectURL(image.dataset.objectUrl);
          delete image.dataset.objectUrl;
        }

        image.removeAttribute('src');
        image.hidden = true;
      }

      async function showImage(image, info, blob) {
        clearImage(image);

        const url = URL.createObjectURL(blob);

        image.dataset.objectUrl = url;
        image.src = url;

        try {
          await image.decode();
        } catch (error) {
          clearImage(image);
          throw error;
        }

        image.hidden = false;

        image.parentElement.querySelector(
          '.placeholder',
        ).hidden = true;

        info.textContent =
          `${image.naturalWidth} × ${image.naturalHeight}px` +
          ` · ${formatBytes(blob.size)}` +
          ` · ${blob.type || 'Unknown format'}`;
      }

      // --------------------------------------------------
      // Analyzer result rendering
      // --------------------------------------------------

      function renderAnalyzerResults(container, report) {
        container.replaceChildren();

        for (const [id, result] of Object.entries(report.results)) {
          const card = document.createElement('div');

          card.className = `analyzer-result ${
            result.passed ? 'passed' : 'failed'
          }`;

          const header = document.createElement('div');
          header.className = 'analyzer-header';

          const name = document.createElement('span');
          name.className = 'analyzer-name';
          name.textContent = formatAnalyzerName(id);

          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = result.passed ? 'PASS' : 'FAIL';

          header.append(name, badge);
          card.append(header);

          if (result.message) {
            const message = document.createElement('p');

            message.className = 'message';
            message.textContent = result.message;

            card.append(message);
          }

          if (
            typeof result.score === 'number' &&
            Number.isFinite(result.score)
          ) {
            const score = document.createElement('div');
            score.className = 'score';

            score.textContent =
              `Score: ${result.score.toFixed(3)}`;

            const track = document.createElement('div');
            track.className = 'score-track';

            const fill = document.createElement('div');
            fill.className = 'score-fill';

            fill.style.width =
              `${Math.max(0, Math.min(1, result.score)) * 100}%`;

            track.append(fill);
            score.append(track);
            card.append(score);
          }

          if (result.metadata) {
            const details = document.createElement('details');

            const summary = document.createElement('summary');
            summary.textContent = 'View metadata';

            const pre = document.createElement('pre');

            pre.textContent = JSON.stringify(
              result.metadata,
              null,
              2,
            );

            details.append(summary, pre);
            card.append(details);
          }

          container.append(card);
        }
      }

      // --------------------------------------------------
      // Reusable uploader controller
      // --------------------------------------------------

      function setupUploader(panel, options) {
        const pipeline = new ImageProcessingPipeline();

        const input = panel.querySelector('input');

        const original = panel.querySelector('.original-image');
        const output = panel.querySelector('.output-image');

        const originalInfo =
          panel.querySelector('.original-info');

        const outputInfo =
          panel.querySelector('.output-info');

        const analyzerResults =
          panel.querySelector('.analyzer-results');

        const duration = panel.querySelector('.duration');

        let busy = false;

        input.disabled = false;

        setStatus(panel, 'Ready to upload');

        input.addEventListener('change', async () => {
          const file = input.files?.[0];

          if (!file || busy) return;

          busy = true;
          input.disabled = true;

          analyzerResults.replaceChildren();

          clearImage(original);
          clearImage(output);

          originalInfo.textContent = '';
          outputInfo.textContent = '';
          duration.textContent = '';

          setPlaceholder(original, 'Loading image…');
          setPlaceholder(output, 'Awaiting validation…');

          setStatus(panel, 'Analyzing image…', 'processing');

          const started = performance.now();

          let analysisDuration;
          let processingDuration;

          try {
            await showImage(original, originalInfo, file);

            // Analyze independently so results remain visible
            // even if processing subsequently fails.

            const analysisStarted = performance.now();

            const validation = await pipeline.process(file, {
              analyzers: options.analyzers,
              analysisResolution: options.analysisResolution,
            });

            analysisDuration =
              performance.now() - analysisStarted;

            renderAnalyzerResults(
              analyzerResults,
              validation.analysis,
            );

            // Only invoke the processor if every analyzer passes.
            if (!validation.passed) {
              const failed = Object.values(
                validation.analysis.results,
              ).filter(result => !result.passed);

              setStatus(
                panel,
                `${failed.length} analyzer(s) failed`,
                'failure',
              );

              setPlaceholder(output, 'Image rejected');

              return;
            }

            setStatus(
              panel,
              'All analyzers passed. Processing…',
              'processing',
            );

            setPlaceholder(output, 'Processing image…');

            const processingStarted = performance.now();

            // Reuse detection metadata from the same image.
            // No additional face/document/barcode detection.

            const bitmap = await createImageBitmap(file);

            let processed;

            try {
              const resolution =
                options.analysisResolution ?? 640;

              const scale = Math.min(
                1,
                resolution / Math.max(
                  bitmap.width,
                  bitmap.height,
                ),
              );

              processed = await options.processor.process({
                bitmap,
                analysis: validation.analysis,

                analysisWidth: Math.max(
                  1,
                  Math.round(bitmap.width * scale),
                ),

                analysisHeight: Math.max(
                  1,
                  Math.round(bitmap.height * scale),
                ),
              });
            } finally {
              bitmap.close();

              processingDuration =
                performance.now() - processingStarted;
            }

            await showImage(output, outputInfo, processed);

            setStatus(
              panel,
              'All analyzers passed. Image processed.',
              'success',
            );
          } catch (error) {
            console.error('Image processing failed:', error);

            setStatus(
              panel,
              error instanceof Error
                ? error.message
                : 'Image processing failed',
              'failure',
            );

            setPlaceholder(output, 'Processing failed');
          } finally {
            const elapsed = performance.now() - started;

            const timings = [];

            if (analysisDuration !== undefined) {
              timings.push(
                `Analysis: ${analysisDuration.toFixed(1)}ms`,
              );
            }

            if (processingDuration !== undefined) {
              timings.push(
                `Processing: ${processingDuration.toFixed(1)}ms`,
              );
            }

            timings.push(
              `Total: ${elapsed.toFixed(1)}ms`,
            );

            duration.textContent = timings.join('\n');

            input.disabled = false;

            // Allow selecting the same image again.
            input.value = '';

            busy = false;
          }
        });
      }

      // --------------------------------------------------
      // Document pipeline
      // --------------------------------------------------

      try {
        setupUploader(documentPanel, {
          analysisResolution: 640,

          analyzers: [
            // new BrightnessAnalyzer(60, 220),

            new ScanicAnalyzer({
              minConfidence: 0.35,
              minCoverage: 0.01,
            }),
          ],

          processor: new ScanicCaptureProcessor({
            padding: 0.08,
            quality: 0.98,
          }),
        });
      } catch (error) {
        console.error('Scanic initialization failed:', error);

        setStatus(
          documentPanel,
          'Unable to initialize document detector',
          'failure',
        );
      }

      // --------------------------------------------------
      // PDF417 barcode pipeline
      // --------------------------------------------------

      try {
        setupUploader(barcodePanel, {
          analysisResolution: 1600,

          analyzers: [
            new BarcodeAnalyzer({
              requiredFormats: ['pdf417'],
              minCount: 1,
              minCoverage: 0,
              includeRawValue: true,
            }),
          ],

          processor: new BarcodeCaptureProcessor({
            format: 'pdf417',
            selection: 'largest',
            padding: 0.15,
            mimeType: 'image/png',
          }),
        });
      } catch (error) {
        console.error('Barcode initialization failed:', error);

        setStatus(
          barcodePanel,
          'Unable to initialize barcode detector',
          'failure',
        );
      }

      // --------------------------------------------------
      // Headshot pipeline
      // --------------------------------------------------

      let detector;

      async function initializeHeadshot() {
        setStatus(
          headshotPanel,
          'Initializing face detector…',
          'processing',
        );

        try {
          const vision = await FilesetResolver.forVisionTasks(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm',
          );

          detector = await FaceDetector.createFromOptions(
            vision,
            {
              baseOptions: {
                modelAssetPath:
                  'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite',

                delegate: 'CPU',
              },

              runningMode: 'IMAGE',
              minDetectionConfidence: 0.5,
            },
          );

          setupUploader(headshotPanel, {
            analysisResolution: 640,

            analyzers: [
              new BrightnessAnalyzer(60, 220),

              new FaceAnalyzer({
                detector,
                minConfidence: 0.3,
                minCoverage: 0.01,
                maxCoverage: 0.85,
                centerTolerance: 1,
              }),
            ],

            processor: new FaceCaptureProcessor({
              aspectRatio: 1 / 1,
              padding: 0.5,
              verticalOffset: -0.15,
              maxDimension: 1600,
              quality: 0.98,
            }),
          });
        } catch (error) {
          console.error(
            'MediaPipe initialization failed:',
            error,
          );

          setStatus(
            headshotPanel,
            'Unable to initialize face detector',
            'failure',
          );
        }
      }

      void initializeHeadshot();

      // --------------------------------------------------
      // Cleanup
      // --------------------------------------------------

      window.addEventListener('pagehide', event => {
        if (event.persisted) return;

        detector?.close();

        document.querySelectorAll('.image-preview img')
          .forEach(image => {
            clearImage(image);
          });
      });
    </script>
  </body>
</html>
