<!DOCTYPE html>
<html>
  <head>
    <title>Guided Capture Playground</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        color: white;
        font-family: system-ui, sans-serif;
      }

      guided-capture,
      #result {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      guided-capture {
        z-index: 0;
      }

      #result {
        object-fit: contain;
        object-position: center;
        background: black;
        z-index: 1;
      }

      #guidance {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;

        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-left: calc(72px + env(safe-area-inset-left, 0px));
        padding-right: calc(72px + env(safe-area-inset-right, 0px));

        text-align: center;
        pointer-events: none;
      }

      #guidance h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        text-shadow: 0 2px 8px #000a;
      }

      #guidance p {
        margin: 8px 0 0;
        font-size: 14px;
        color: #ddd;
        text-shadow: 0 2px 8px #000a;
      }

      #torch {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top, 0px));
        right: calc(16px + env(safe-area-inset-right, 0px));
        z-index: 10;

        display: none;
        align-items: center;
        justify-content: center;

        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background: #0009;
        color: white;
        cursor: pointer;
        backdrop-filter: blur(12px);
      }

      #torch svg {
        width: 24px;
        height: 24px;
      }

      #torch-on {
        display: none;
      }

      body:has(guided-capture[torch-supported]) #torch {
        display: flex;
      }

      body:has(guided-capture[torch-enabled]) #torch {
        background: #facc15;
        color: black;
      }

      body:has(guided-capture[torch-enabled]) #torch-on {
        display: block;
      }

      body:has(guided-capture[torch-enabled]) #torch-off {
        display: none;
      }

      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;

        padding: 16px;
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
        padding-right: calc(16px + env(safe-area-inset-right, 0px));

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;

        pointer-events: none;
      }

      #analysis-results {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .analysis-result {
        display: flex;
        align-items: center;
        gap: 6px;

        padding: 8px 12px;
        border-radius: 999px;
        background: #000a;
        backdrop-filter: blur(12px);

        font-size: 13px;
        color: white;
      }

      .analysis-result.passed {
        color: #86efac;
      }

      .analysis-result.failed {
        color: #fca5a5;
      }

      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      #capture {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        padding: 16px 32px;
        border: none;
        border-radius: 999px;
        background: white;
        color: black;

        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;

        box-shadow: 0 4px 20px #0005;
        pointer-events: auto;

        transition:
          background 150ms ease,
          opacity 150ms ease;
      }

      body:has(guided-capture[ready]) #capture {
        background: #22c55e;
        color: black;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait !important;
      }

      #hint {
        font-size: 14px;
        text-shadow: 0 1px 6px black;
      }

      #spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #0003;
        border-top-color: black;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      #spinner,
      #capturing-label,
      #hint {
        display: none;
      }

      body:has(guided-capture[capturing]) #spinner,
      body:has(guided-capture[capturing]) #capturing-label,
      body:has(guided-capture[capturing]) #hint {
        display: block;
      }

      body:has(guided-capture[capturing]) #label {
        display: none;
      }

      body:has(#result:not([hidden])) #torch,
      body:has(#result:not([hidden])) #guidance,
      body:has(#result:not([hidden])) #analysis-results {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <guided-capture
        auto-torch
        auto-torch-delay="1500"
        analysis-fps="5"
        analysis-resolution="640"
        capture-cache-duration="1500"
    ></guided-capture>

    <img id="result" hidden alt="Captured photo">

    <div id="guidance">
      <h2>Scan your ID</h2>
      <p id="guidance-message">
        Position your ID inside the frame
      </p>
    </div>

    <button id="torch" aria-label="Toggle torch" aria-pressed="false">
      <svg
        id="torch-on"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M13 2 3 14h8l-1 8 11-12h-9l1-8z"/>
      </svg>

      <svg
        id="torch-off"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m12 5 1-3-3 3"/>
        <path d="M18 10h3l-3 3"/>
        <path d="m8 8-5 6h8l-1 8 5-6"/>
        <path d="m2 2 20 20"/>
      </svg>
    </button>

    <div id="controls">
      <div id="analysis-results"></div>

      <span id="hint">Hold steady</span>

      <button id="capture">
        <span id="spinner"></span>
        <span id="capturing-label">Capturing…</span>
        <span id="label">Capture Photo</span>
      </button>
    </div>

    <script type="module">
	  import { BrightnessAnalyzer, ScanicAnalyzer,
		  ScanicCaptureProcessor,
 } from '/src/image-capture/index.ts';

      const camera = document.querySelector('guided-capture');
      const result = document.querySelector('#result');
      const button = document.querySelector('#capture');
      const label = document.querySelector('#label');
      const torch = document.querySelector('#torch');
      const analysisResults = document.querySelector('#analysis-results');
      const guidanceMessage = document.querySelector('#guidance-message');

      let captured = false;
      let photoURL;

      // Guided capture configuration

      camera.boundingBox = {
        aspectRatio: 85.6 / 53.98,
        width: 0.85,
        maxHeight: 0.8,
        borderRadius: 12,
        maskOpacity: 0.65,
        borderWidth: 2,
        borderColor: 'white',
      };

      camera.analyzers = [
        new BrightnessAnalyzer(60, 220),
        new ScanicAnalyzer(),
      ];

      camera.captureProcessor = new ScanicCaptureProcessor({
        padding: 0.08,
        quality: 0.98,
      });

      // Live analysis feedback

      camera.addEventListener('analysis', event => {
        if (captured) return;

        const { ready, results } = event.detail;

        analysisResults.replaceChildren();

        for (const [id, analysis] of Object.entries(results)) {
          const chip = document.createElement('div');

          chip.className = `analysis-result ${
            analysis.passed ? 'passed' : 'failed'
          }`;

          const indicator = document.createElement('span');
          indicator.className = 'indicator';

          const text = document.createElement('span');

          const name = id.charAt(0).toUpperCase() +
            id.slice(1).replaceAll('-', ' ');

          text.textContent = analysis.passed
            ? `${name}: OK`
            : analysis.message ?? `${name}: Failed`;

          chip.append(indicator, text);
          analysisResults.append(chip);
        }

        const failed = Object.values(results)
          .find(analysis => !analysis.passed);

        guidanceMessage.textContent = ready
          ? 'Lighting looks good. Align your ID.'
          : failed?.message ?? 'Adjust your camera';
      });

      // Photo lifecycle

      function clearPhoto() {
        result.hidden = true;
        result.removeAttribute('src');

        if (photoURL) {
          URL.revokeObjectURL(photoURL);
          photoURL = undefined;
        }
      }

      function syncTorch() {
        torch.setAttribute(
          'aria-pressed',
          String(camera.torchEnabled)
        );
      }

      // Torch control

      torch.addEventListener('click', async () => {
        if (camera.capturing || torch.disabled) return;

        torch.disabled = true;
        button.disabled = true;

        try {
          await camera.toggleTorch();
        } catch (error) {
          console.error('Torch failed:', error);
        } finally {
          syncTorch();
          torch.disabled = false;
          button.disabled = false;
        }
      });

      // Capture / recapture

      button.addEventListener('click', async () => {
        if (camera.capturing || button.disabled) return;

        if (captured) {
          clearPhoto();

          captured = false;
          camera.analysisEnabled = true;

          analysisResults.replaceChildren();

          guidanceMessage.textContent =
            'Position your ID inside the frame';

          label.textContent = 'Capture Photo';

          return;
        }

        button.disabled = true;
        torch.disabled = true;

        try {
          const photo = await camera.capture();

          label.textContent = 'Processing…';

          photoURL = URL.createObjectURL(photo);
          result.src = photoURL;

          await result.decode();

          result.hidden = false;
          captured = true;

          if (camera.torchEnabled) {
            try {
              await camera.setTorch(false);
            } catch (error) {
              console.warn('Failed to disable torch:', error);
            }

            syncTorch();
          }

          console.log('Captured:', photo);
        } catch (error) {
          clearPhoto();

          captured = false;
          camera.analysisEnabled = true;

          console.error('Capture failed:', error);

          alert(error instanceof Error
            ? error.message
            : 'Capture failed');
        } finally {
          button.disabled = false;
          torch.disabled = false;

          label.textContent = captured
            ? 'Recapture'
            : 'Capture Photo';
        }
      });

      camera.addEventListener('camera-error', event => {
        guidanceMessage.textContent = 'Unable to access camera';
        console.error(event.detail);
      });
    </script>
  </body>
</html>
